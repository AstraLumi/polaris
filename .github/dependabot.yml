# Monthly pull requests for outdated dependencies, one per place.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      prosemirror:
        patterns: ['prosemirror-*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
