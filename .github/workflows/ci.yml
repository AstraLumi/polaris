name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Vet and test
        working-directory: backend
        run: go vet ./... && go test -count=1 ./...

  # The same tests with Go's race detector, which sees two requests touching
  # the same memory at once (the caches, the story manager). Slower, and a
  # job of its own so its verdict is read apart from the tests'.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Tests with the race detector
        working-directory: backend
        run: go test -race -count=1 ./...

  # Known vulnerabilities in what Polaris is built from. Only the code the
  # backend really calls counts; for the frontend, only what ships.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Go modules
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm packages
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Tests and translation coverage
        working-directory: frontend
        run: npm test
