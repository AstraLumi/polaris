name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Tidy modules if go.sum is missing
        working-directory: backend
        run: if [ ! -f go.sum ]; then go mod tidy; fi
      - name: Vet and test
        working-directory: backend
        run: go vet ./... && go test -count=1 ./...

  # Known vulnerabilities in what Polaris is built from. Only the code the
  # backend really calls counts; for the frontend, only what ships.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Go modules
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm packages
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Translation coverage and layout tests
        working-directory: frontend
        run: |
          node tests/i18n.check.mjs
          node tests/timelineLayout.test.mjs
          node tests/markdown.test.mjs
          node tests/markdownEdit.test.mjs
          node tests/graphLayout.test.mjs
          node tests/familyLayout.test.mjs
          node tests/dateDigits.test.mjs
          node tests/storyTime.test.mjs
          node tests/formulaBlocks.test.mjs
