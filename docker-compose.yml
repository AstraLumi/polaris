# Polaris: one container, two named volumes.
#
# By default the app is reachable only from this machine
# (http://localhost:8091). Polaris has NO login of its own, so before you
# expose it to anything else, put your own authentication in front of it (a
# reverse proxy with auth, a VPN, a tunnel with access control, ...).
# Copy .env.example to .env to change the address, the port or the version.
#
# `docker compose up -d` runs the ready-made image of each release;
# `docker compose up -d --build` builds it from this folder's code instead.
name: polaris

services:
  polaris:
    image: ghcr.io/astralumi/polaris:${POLARIS_VERSION:-latest}
    build: .
    container_name: polaris
    restart: unless-stopped
    # Nothing in the container needs more than its two volumes: its own
    # files are read-only and it holds no special rights. The three given
    # back are used once, at start, to hand the volumes to an ordinary user
    # and become it (docker/entrypoint.sh); Polaris itself then runs as
    # that user, with none.
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - PORT=8091
      - DATA_DIR=/data
      - UPLOADS_DIR=/app/uploads
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - AUTO_BACKUPS=${AUTO_BACKUPS:-}
    volumes:
      - polaris_data:/data
      - polaris_uploads:/app/uploads
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8091}:8091"

volumes:
  polaris_data:
  polaris_uploads:
